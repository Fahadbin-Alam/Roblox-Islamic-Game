name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  luau:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Luau tooling
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          cd "$RUNNER_TEMP/tools"
          curl -sSL -o luau.zip https://github.com/luau-lang/luau/releases/latest/download/luau-ubuntu.zip
          unzip -q luau.zip
          curl -sSL -o lsp.zip https://github.com/JohnnyMorganz/luau-lsp/releases/download/1.70.1/luau-lsp-linux-x86_64.zip
          unzip -q lsp.zip
          curl -sSL -o globalTypes.d.luau https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/1.70.1/scripts/globalTypes.d.luau
          curl -sSL -o rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.4.4/rojo-7.4.4-linux-x86_64.zip
          unzip -q rojo.zip
          chmod +x luau luau-lsp rojo

      - name: Unit tests
        run: tests/luau/run.sh "$RUNNER_TEMP/tools/luau"

      - name: Static analysis
        run: tests/analyze.sh "$RUNNER_TEMP/tools/luau-lsp" "$RUNNER_TEMP/tools/rojo" "$RUNNER_TEMP/tools/globalTypes.d.luau"
